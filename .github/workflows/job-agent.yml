name: 맞춤 채용 취합 에이전트

on:
  schedule:
    # 매일 23:00 UTC = 08:00 KST (한국 아침)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write          # seen_jobs.json 커밋용

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        working-directory: job-agent
        run: pip install -r requirements.txt

      - name: 채용 취합 실행
        working-directory: job-agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        run: python -m jobagent.main

      - name: 신규 공고 기록 커밋
        run: |
          git config user.name "job-agent[bot]"
          git config user.email "actions@github.com"
          git add data/seen_jobs.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update seen jobs $(date -u +%Y-%m-%d)"
            git push
          fi
