# ─────────────────────────────────────────────────────────────
#  채용 취합 에이전트 설정
#  "나에게 맞는" 기준 = 안정호(Leo Ahn) 프로필 기반
#  키워드/가중치만 바꾸면 다른 사람에게도 재사용 가능
# ─────────────────────────────────────────────────────────────

# 각 소스에 던질 검색어 (한국어 + 영어)
queries:
  - "마케팅 팀장"
  - "그로스 마케팅"
  - "퍼포먼스 마케팅"
  - "브랜드 마케팅"
  - "CRM 마케팅"
  - "마케팅 리드"
  - "growth marketing"
  - "performance marketing"
  - "head of marketing"

# 로그인된 크롬 세션 설정 (A안: Playwright + 실제/전용 프로필)
browser:
  user_data_dir: auto   # auto = 전용 자동화 프로필(권장, 재로그인 필요).
                        # 실제 크롬 로그인을 그대로 쓰려면 크롬 User Data 폴더 지정:
                        #   "C:/Users/<이름>/AppData/Local/Google/Chrome/User Data"
  profile_directory:    # 위 폴더 안에서 쓸 계정 프로필. 비우면 전용 프로필.
                        # leoflyagain 계정이면 보통 "Profile 1"/"Profile 2" 등.
                        # 정확한 값은 크롬에서 해당 계정으로 chrome://version → "프로필 경로" 확인.
                        # ※ 실제 프로필 사용 시 실행 중에는 크롬을 완전히 종료해야 함(프로필 잠금).
  channel: chrome       # 설치된 Chrome 사용(별도 다운로드 불필요)
  headless: true        # 일일 실행은 true, --login/--headed 시 자동으로 창 표시

# 소스별 on/off — 모두 로그인된 크롬으로 직접 수집
sources:
  wanted: true
  linkedin: true        # 로그인 시 차단 우회 + 추천 공고
  saramin: true         # 로그인 시 맞춤 정보 반영
  jobkorea: true
  remember: true        # 로그인 필수 — career.rememberapp.co.kr 추천 포지션

# 결과 필터
filters:
  min_score: 4.0          # 이 점수 미만은 버림
  max_results: 30         # 다이제스트 최대 공고 수
  locations_preferred:    # 들어있으면 가산점 (필수는 아님)
    - "서울"
    - "원격"
    - "remote"
    - "재택"
  exclude_keywords:       # 제목에 있으면 제외 (영업직/무관 직무 등)
    - "영업관리"
    - "텔레마케팅"
    - "콜센터"
    - "아르바이트"
    - "인턴"

# 지원자 프로필 (채용 가능성 계산용)
profile:
  years_experience: 17       # 안정호님 총 경력
  # 가장 자연스러운 타겟 연차대(이 안이면 '경력적합' 가산, 너무 낮으면 과스펙)
  sweet_spot_min: 8
  sweet_spot_max: 20

# 적합도 채점 키워드 (가중치)
scoring:
  # 핵심 직무 (제목/본문에 있으면 강한 매칭)
  core:
    weight: 3.0
    keywords:
      - 마케팅
      - marketing
      - 그로스
      - growth
      - 퍼포먼스
      - performance
      - 브랜드
      - brand
      - crm
      - 리테일미디어
      - retail media
      - rmn
      - 디지털마케팅
  # 도메인 보너스 (안정호님 경험과 겹치는 영역)
  domain:
    weight: 1.0
    keywords:
      - 이커머스
      - 커머스
      - commerce
      - 앱
      - app
      - 핀테크
      - fintech
      - 미디어
      - media
      - 광고
      - 데이터
      - data
      - ai
      - 자동화
      - automation
      - 캠페인
      - campaign
      - 리텐션
      - retention
      - 그로스해킹
  # 시니어/리드 신호 (레벨 판별 + 가산점)
  senior:
    weight: 2.0
    keywords:
      - 팀장
      - 리드
      - lead
      - head
      - 총괄
      - 매니저
      - manager
      - 디렉터
      - director
      - 본부장
      - 실장
  # 임원/C레벨 신호
  executive:
    weight: 2.0
    keywords:
      - cmo
      - 임원
      - vp
      - "vice president"
      - 부사장
      - 마케팅본부장
      - chief
  # 제목 가중 배수 (제목에서 매칭되면 더 크게 반영)
  title_multiplier: 2.0
  # 최신 공고 가산점
  recency_bonus: 1.5   # 최근 3일 이내

  # 경력 연차 적합도 (채용 가능성의 핵심 신호)
  years:
    fit_bonus: 4.0            # 요구연차가 sweet spot 안 → 강한 가산
    near_bonus: 2.0           # sweet spot 근처(±3년)
    overqualified_penalty: 3.0   # 요구연차가 sweet_spot_min보다 한참 낮음(주니어 공고)
    underqualified_penalty: 2.0  # 요구연차가 내 경력보다 높음(언더스펙)

  # 마감 임박 처리 (정보용 가산 — 빨리 움직이라는 신호)
  deadline:
    imminent_days: 3         # 마감까지 이 일수 이하면 '마감임박' 플래그
    imminent_bonus: 1.0

  # 회사 규모/유형 가중치
  company:
    enterprise_bonus: 2.0    # 아래 known_enterprises 매칭 → '대기업' 플래그
    startup_bonus: 1.5       # startup_signals 매칭 → '스타트업' 플래그
    known_enterprises:       # 안정호님 경험과 잘 맞는 대형/유명 기업
      - 삼성
      - 롯데
      - 신세계
      - 현대
      - 쿠팡
      - 네이버
      - 카카오
      - 토스
      - 배달의민족
      - 우아한형제들
      - 무신사
      - 컬리
      - 당근
      - 다나와
      - 11번가
      - gs
      - cj
      - kt
      - sk
      - lg
      - 야놀자
      - 직방
    startup_signals:         # 스타트업/그로스 단계 신호
      - 시리즈
      - series
      - 스타트업
      - startup
      - 유니콘
      - 투자유치
      - 그로스
      - pre-a
      - 시드
